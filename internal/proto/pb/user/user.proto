syntax = "proto2";

option optimize_for = SPEED;

option go_package = "./user/";

message Person {
optional string name = 1;
optional int32 age = 2;
optional bool is_student = 3;
}

message Login {
  option (OptionMessageId)                                        = SC_MSG_Hall_Show_Response;
  required string name = 1;
}

message Match {
  required  string name = 1;
}

message Enter {
  required  string  name = 1;
}